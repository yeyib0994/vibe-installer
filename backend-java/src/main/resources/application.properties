server.port=${PORT:8848}
server.address=0.0.0.0

# 上传文件大小限制
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# 数据目录（K8s 下通过环境变量 CLOUDOPS_DATA_DIR 覆盖，挂载到 PVC）
cloudops.data.dir=${CLOUDOPS_DATA_DIR:data}

# 日志输出到 stdout，便于 K8s 日志采集
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.level.com.cloudops=INFO
logging.file.name=
spring.main.banner-mode=off
