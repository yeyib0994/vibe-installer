# 浏览器进集群的唯一入口：页面与 /api 都从这里走（同源，不涉及 CORS）。
# 30848 那个 Service 仍在，但它只是裸 API —— 前端解耦后 / 上已经没有页面了。
apiVersion: v1
kind: Service
metadata:
  name: shipdesk-web
  namespace: cloudops
  labels:
    app: shipdesk-web
spec:
  type: NodePort
  selector:
    app: shipdesk-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30880
      protocol: TCP
